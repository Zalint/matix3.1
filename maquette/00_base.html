<title>ERP Mata</title>
<style>
/* ================= FONTS (embedded) ================= */
@font-face{font-family:'Rubik';font-style:normal;font-weight:400 700;font-display:swap;src:url(data:font/woff2;base64,__RUBIK__) format('woff2')}
@font-face{font-family:'Nunito Sans';font-style:normal;font-weight:400 800;font-display:swap;src:url(data:font/woff2;base64,__NUNITO__) format('woff2')}
@font-face{font-family:'Fira Code';font-style:normal;font-weight:400 700;font-display:swap;src:url(data:font/woff2;base64,__FIRACODE__) format('woff2')}

/* ================= RESET / SHARED ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:#F4F3F0}
:root[data-theme="dark"] body{background:#0C0D12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:#0C0D12}}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2px solid #C42A21;outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.amt{font-family:'Fira Code',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.amt .cur{font-size:.68em;font-weight:500;opacity:.62;margin-left:.32em;letter-spacing:.02em}

/* Templates hidden by default */

/* ================= SHARED TOOLTIP / TOAST ================= */
.ftip{position:fixed;z-index:300;max-width:320px;background:#15161C;color:#F0F1F5;border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.4);font-family:'Nunito Sans',system-ui,sans-serif;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.ftip.on{opacity:1;transform:none}
.ftip .t{font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9BA0AF;margin-bottom:5px}
.ftip code{font-family:'Fira Code',monospace;font-size:11.5px;color:#FFD9D6;display:block;white-space:normal;word-break:break-word}
.toast{position:fixed;bottom:76px;left:50%;transform:translate(-50%,12px);z-index:250;background:#15161C;color:#F0F1F5;border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:11px 16px;box-shadow:0 12px 32px rgba(0,0,0,.4);font-family:'Nunito Sans',system-ui,sans-serif;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:min(92vw,420px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ok-ic{display:inline-block;vertical-align:-3px;margin-right:7px;color:#3ECF8E}

/* Formula trigger — shared behavior, styled per template */
.fx{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;cursor:help;vertical-align:-2px;margin-left:5px}
.fx svg{width:15px;height:15px}
</style>
